spring.application.name=helpdesk
server.port=${SERVER_PORT:8083}

jwt.secret=${JWT_SECRET:helpdesk-dev-secret-change-me-32-bytes-min}

helpdesk.admin.email=${ADMIN_EMAIL:admin@helpdesk.local}
helpdesk.admin.password=${ADMIN_PASSWORD:admin}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/helpdesk_db}
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:rootpassword}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=${DATABASE_SCHEMA:user_schema}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
helpdesk.rabbitmq.exchange=${RABBITMQ_EXCHANGE:helpdesk.events}
helpdesk.rabbitmq.routing-key=${RABBITMQ_ROUTING_KEY:ticket.technician.assign}
helpdesk.rabbitmq.response-routing-key=${RABBITMQ_RESPONSE_ROUTING_KEY:user.technician.assignment.result}

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-retries=5
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000

logging.structured.format.console=ecs
logging.pattern.level=%5p [correlationId=%X{correlationId}]

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when_authorized